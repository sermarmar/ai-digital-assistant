# Compila la app de Windows y la deja como carpeta portable (se abre sin instalar nada).
# El resultado se descarga desde la pestaña Actions del repositorio, en "Artifacts".
name: App Windows (portable)

on:
  workflow_dispatch:
  push:
    branches: [app-react-native]
    paths:
      - 'app/**'
      - '.github/workflows/windows.yml'

jobs:
  build:
    runs-on: windows-2025-vs2026
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la app portable
        run: npm run build:windows

      - uses: actions/upload-artifact@v7
        with:
          name: AsistenteReuniones-windows-x64
          path: app/dist/AsistenteReuniones

      - name: Guardar el log de compilación si falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: app/build.binlog
