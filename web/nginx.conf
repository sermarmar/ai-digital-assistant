server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Mismo límite de tamaño de audio que el servicio api
    client_max_body_size 500m;

    # /api/... se envía a api quitando el prefijo, igual que hace Vite en desarrollo
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        # Pasa el audio a api según llega, sin guardarlo antes en disco
        proxy_request_buffering off;
        # Corregir un diagrama con Claude puede tardar más de 60 s
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
